<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yafania: Build the Concert</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.youtube.com/game_api/v1"></script>
  </head>
  <body>
    <main class="app" aria-label="Yafania: Build the Concert">
      <section class="topbar">
        <div>
          <p class="eyebrow">Yafania Playable Prototype</p>
          <h1>Build the Concert</h1>
        </div>
        <button class="primary" id="performButton" type="button">Perform</button>
      </section>

      <section class="stage-wrap" aria-label="Concert stage">
        <div class="venue" id="venue">
          <div class="sky"></div>
          <div class="audience" id="audience"></div>
          <div class="stage" id="stage" aria-live="polite">
            <div class="backdrop" id="backdrop">YAFANIA</div>
            <div class="placed-items" id="placedItems"></div>
            <div class="hint" id="stageHint">Choose tools below, then tap the stage to place items.</div>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="Concert controls">
        <nav class="tabs" id="tabs" aria-label="Build sections"></nav>
        <div class="panel" id="panel"></div>
      </section>

      <section class="score hidden" id="scoreScreen" aria-label="Concert score">
        <div class="score-card">
          <button class="close" id="closeScore" type="button" aria-label="Close score">x</button>
          <p class="eyebrow">Concert Complete</p>
          <h2 id="scoreTitle">5 Stars</h2>
          <div class="stars" id="stars"></div>
          <p class="score-number" id="scoreNumber"></p>
          <ul id="scoreBreakdown"></ul>
          <button class="primary" id="replayButton" type="button">Perform Again</button>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
